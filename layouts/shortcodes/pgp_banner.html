{{- $ascPath := printf "content/%s.asc" .Page.File.Path -}}

{{ if fileExists $ascPath }}
<div class="pgp-banner" style="border:1px solid #ccc; padding:0.5em; margin:1em 0; text-align:center; font-size:0.9em;">
  ⚡ <strong>This post is PGP-verified.</strong><br>
  Verify this post: 
  <a href="./{{ .Page.File.LogicalName }}.asc" target="_blank">{{ .Page.File.LogicalName }}.asc</a><br>
  Public key: <a href="/pgp.asc" target="_blank">pgp.asc</a>
</div>
{{ else }}
<div class="pgp-banner pgp-warning" style="border:1px solid #f00; padding:0.5em; margin:1em 0; text-align:center; font-size:0.9em; color:#900;">
  ⚠️ <strong>Warning:</strong> Signed version missing! Authenticity cannot be verified.
</div>
{{ end }}
