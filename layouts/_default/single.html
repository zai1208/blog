{{ define "main" }}
  {{ partial "header.html" . }}

  <article class="post-content">
    <h1>{{ .Title }}</h1>
    <p class="post-meta">
      {{ .Date.Format "2 Jan 2006" }} • {{ with .Params.author }}{{ . }}{{ end }}
    </p>

    {{ .Content }}

    <!-- PGP banner using partial -->
    {{ partial "pgp_banner.html" . }}

  </article>

  {{ partial "footer.html" . }}
{{ end }}
